name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Rust contracts ────────────────────────────────────────────────────────
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Soroban SDK 26+ compiles to wasm32v1-none, not wasm32-unknown-unknown.
          # Unit tests run on the host (x86_64) so no wasm target is needed for CI.
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Use --lib to avoid the cdylib native-link issue on linux in CI.
        # Tests are run separately below.
        run: cargo clippy --workspace --lib -- -D warnings

      - name: Unit tests
        # wasm-tests require stellar-cli to build the contracts first.
        # That is an integration-level step; unit tests run without it.
        run: cargo test --workspace

  # ── TypeScript — indexer ─────────────────────────────────────────────────
  indexer:
    name: Indexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # npm ci must run from the root where package.json workspaces are declared
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm install --ignore-scripts

      - name: Type check — indexer
        run: npm run typecheck --workspace=packages/indexer

  # ── TypeScript — web ─────────────────────────────────────────────────────
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm install --ignore-scripts

      - name: Type check — web
        run: npm run typecheck --workspace=packages/web

      - name: Lint — web
        run: npm run lint --workspace=packages/web

      # Full next build is an integration step (requires DB + env at runtime).
      # Type check + lint above are sufficient to catch regressions in CI.
      # Uncomment the block below once all workspace package imports are resolved
      # via npm workspaces rather than relative paths.
      #
      # - name: Build — web
      #   run: npm run build --workspace=packages/web
      #   env:
      #     NEXT_PUBLIC_RATIFY_RPC_URL: https://soroban-testnet.stellar.org
      #     NEXT_PUBLIC_RATIFY_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      #     RATIFY_DB_PATH: /tmp/ratify.db
      #     RATIFY_FACTORY_ID: CBTXUGABEUSSOZCYQ5LEMLK2FXGK5EIEOO6S23R4MHPEUVZ5ETOFCJO2
