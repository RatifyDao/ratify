<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1f4fa3"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0eaff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- ── Mark: rounded square with vote-check motif ── -->
  <rect x="10" y="10" width="100" height="100" rx="22" ry="22"
        fill="url(#mark-grad)"/>

  <!-- Ballot lines (three horizontal rules) -->
  <rect x="30" y="36" width="44" height="6" rx="3" fill="url(#check-grad)" opacity="0.4"/>
  <rect x="30" y="57" width="44" height="6" rx="3" fill="url(#check-grad)" opacity="0.4"/>
  <rect x="30" y="78" width="28" height="6" rx="3" fill="url(#check-grad)" opacity="0.4"/>

  <!-- Bold checkmark overlaid on ballot -->
  <polyline points="62,50 72,64 94,36"
            fill="none"
            stroke="url(#check-grad)"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- ── Wordmark ── -->
  <!-- "Ratify" -->
  <text x="128" y="72"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="44"
        font-weight="700"
        letter-spacing="-1"
        fill="#131a22">Ratify</text>

  <!-- "DAO" — authority blue, lighter weight -->
  <text x="272" y="72"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="44"
        font-weight="300"
        letter-spacing="1"
        fill="#1f4fa3">DAO</text>

  <!-- Thin rule under wordmark -->
  <line x1="128" y1="82" x2="390" y2="82"
        stroke="#d3d8de" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="128" y="100"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13"
        font-weight="400"
        letter-spacing="2.5"
        fill="#66717d">ON-CHAIN GOVERNANCE · STELLAR</text>
</svg>
