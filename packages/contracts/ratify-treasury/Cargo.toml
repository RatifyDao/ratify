[package]
name = "ratify-treasury"
version = "0.1.0"
edition = "2021"
description = "Community treasury that pays out only on instruction from the timelock, inside a policy governance itself sets."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
