[package]
name = "ratify-weight-rule"
version = "0.1.0"
edition = "2021"
description = "Answers one question: how much is this account's vote worth at this point in time."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-governance = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ratify-membership = { path = "../ratify-membership" }
